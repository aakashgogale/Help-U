<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDE2E7"/>
      <stop offset="0.18" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#F6F7F9"/>
      <stop offset="1" stop-color="#CFD5DB"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F4F6"/>
      <stop offset="1" stop-color="#E2E6EA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3137"/>
      <stop offset="1" stop-color="#14181C"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E979F"/>
      <stop offset="0.5" stop-color="#E6E9EC"/>
      <stop offset="1" stop-color="#858E97"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5CCD3"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- pipes -->
  <rect x="212" y="396" width="16" height="74" rx="4" fill="url(#pipe)"/>
  <rect x="284" y="396" width="16" height="74" rx="4" fill="url(#pipe)"/>
  <rect x="207" y="420" width="26" height="10" rx="3" fill="#2F7DE1"/>
  <rect x="279" y="420" width="26" height="10" rx="3" fill="#E5484D"/>

  <!-- tank -->
  <rect x="146" y="44" width="220" height="360" rx="96" fill="url(#tank)" stroke="#D1D7DD" stroke-width="2"/>

  <!-- sheen -->
  <path d="M176 120 Q176 74 214 62 L214 380 Q176 368 176 330 Z" fill="#FFFFFF" opacity="0.65"/>

  <!-- top + bottom accent rings -->
  <path d="M168 118 Q256 92 344 118" fill="none" stroke="#D9DEE3" stroke-width="3"/>
  <path d="M168 330 Q256 356 344 330" fill="none" stroke="#D9DEE3" stroke-width="3"/>

  <!-- control panel -->
  <rect x="196" y="190" width="120" height="92" rx="16" fill="url(#panel)" stroke="#D3D9DF" stroke-width="1.5"/>
  <rect x="210" y="202" width="62" height="34" rx="7" fill="url(#screen)"/>
  <text x="217" y="226" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFB25C">55°C</text>
  <circle cx="292" cy="219" r="13" fill="url(#knob)" stroke="#B9C1C9" stroke-width="1.5"/>
  <rect x="290.5" y="208" width="3" height="9" rx="1.5" fill="#7A848E"/>

  <!-- indicators -->
  <circle cx="220" cy="258" r="5" fill="#E5484D"/>
  <circle cx="240" cy="258" r="5" fill="#4CC38A"/>
  <rect x="256" y="255" width="44" height="6" rx="3" fill="#C9CFD5"/>

  <!-- flame badge -->
  <path d="M256 128 C268 142 274 152 274 164 a18 18 0 0 1 -36 0 c0 -9 5 -15 10 -20 c0 8 4 12 8 12 c-2 -10 -2 -18 2 -28 Z" fill="#F97316" opacity="0.9"/>
  <path d="M256 152 c6 6 9 10 9 15 a9 9 0 0 1 -18 0 c0 -5 4 -9 9 -15 Z" fill="#FDBA74"/>
</svg>
