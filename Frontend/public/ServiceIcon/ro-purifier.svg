<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDE2E7"/>
      <stop offset="0.18" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#F6F7F9"/>
      <stop offset="1" stop-color="#CFD5DB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FD"/>
      <stop offset="1" stop-color="#D4E5F8"/>
    </linearGradient>
    <linearGradient id="filter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E8ED"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E979F"/>
      <stop offset="0.5" stop-color="#E6E9EC"/>
      <stop offset="1" stop-color="#858E97"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- body -->
  <rect x="144" y="56" width="224" height="380" rx="44" fill="url(#body)" stroke="#D1D7DD" stroke-width="2"/>

  <!-- transparent filter chamber -->
  <rect x="164" y="76" width="184" height="168" rx="26" fill="url(#glass)" stroke="#BFD3EA" stroke-width="2"/>
  <rect x="184" y="98" width="144" height="30" rx="15" fill="url(#filter)" stroke="#C9D3DD" stroke-width="1.5"/>
  <rect x="236" y="98" width="40" height="30" fill="#2F7DE1" opacity="0.85"/>
  <rect x="184" y="144" width="144" height="30" rx="15" fill="url(#filter)" stroke="#C9D3DD" stroke-width="1.5"/>
  <rect x="236" y="144" width="40" height="30" fill="#2F7DE1" opacity="0.85"/>
  <rect x="184" y="190" width="144" height="30" rx="15" fill="url(#filter)" stroke="#C9D3DD" stroke-width="1.5"/>
  <rect x="236" y="190" width="40" height="30" fill="#2F7DE1" opacity="0.85"/>
  <path d="M174 92 Q174 84 182 82 L182 236 Q174 234 174 226 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- divider -->
  <path d="M150 262 Q256 284 362 262" fill="none" stroke="#2F7DE1" stroke-width="6" stroke-linecap="round"/>

  <!-- sheen -->
  <path d="M168 280 L184 284 L184 412 Q168 404 168 392 Z" fill="#FFFFFF" opacity="0.65"/>

  <!-- brand badge with water drop -->
  <circle cx="256" cy="318" r="26" fill="#2F7DE1"/>
  <path d="M256 302 C264 312 268 318 268 324 a12 12 0 0 1 -24 0 c0 -6 4 -12 12 -22 Z" fill="#FFFFFF"/>

  <!-- indicators -->
  <circle cx="330" cy="300" r="5" fill="#4CC38A"/>
  <circle cx="330" cy="318" r="5" fill="#2F7DE1"/>
  <circle cx="330" cy="336" r="5" fill="#E5484D"/>

  <!-- tap -->
  <rect x="240" y="364" width="32" height="18" rx="6" fill="url(#pipe)"/>
  <rect x="249" y="380" width="14" height="28" rx="5" fill="url(#pipe)"/>
  <rect x="250" y="370" width="12" height="6" rx="3" fill="#2F7DE1"/>
</svg>
