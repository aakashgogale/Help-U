<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDE2E7"/>
      <stop offset="0.12" stop-color="#FFFFFF"/>
      <stop offset="0.8" stop-color="#F6F7F9"/>
      <stop offset="1" stop-color="#CFD5DB"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F4F6"/>
      <stop offset="1" stop-color="#E2E6EA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3137"/>
      <stop offset="1" stop-color="#14181C"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E979F"/>
      <stop offset="0.5" stop-color="#E6E9EC"/>
      <stop offset="1" stop-color="#858E97"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5CCD3"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- feet -->
  <rect x="120" y="356" width="36" height="14" rx="5" fill="#8E979F"/>
  <rect x="356" y="356" width="36" height="14" rx="5" fill="#8E979F"/>

  <!-- body -->
  <rect x="84" y="146" width="344" height="216" rx="26" fill="url(#body)" stroke="#D1D7DD" stroke-width="2"/>
  <path d="M108 170 Q108 160 118 158 L118 350 Q108 348 108 338 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- door window -->
  <rect x="112" y="174" width="206" height="160" rx="16" fill="url(#screen)"/>
  <path d="M130 186 L214 186 L150 322 L130 322 Z" fill="#FFFFFF" opacity="0.08"/>
  <rect x="126" y="188" width="178" height="132" rx="10" fill="none" stroke="#3B444D" stroke-width="2"/>

  <!-- handle -->
  <rect x="326" y="180" width="10" height="148" rx="5" fill="url(#pipe)"/>

  <!-- control panel -->
  <rect x="346" y="172" width="64" height="164" rx="12" fill="url(#panel)" stroke="#D3D9DF" stroke-width="1.5"/>
  <rect x="355" y="182" width="46" height="24" rx="5" fill="url(#screen)"/>
  <text x="361" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4CC38A">12:00</text>
  <rect x="356" y="216" width="44" height="12" rx="4" fill="#FFFFFF" stroke="#D1D7DD" stroke-width="1.5"/>
  <rect x="356" y="234" width="44" height="12" rx="4" fill="#FFFFFF" stroke="#D1D7DD" stroke-width="1.5"/>
  <rect x="356" y="252" width="44" height="12" rx="4" fill="#FFFFFF" stroke="#D1D7DD" stroke-width="1.5"/>
  <circle cx="378" cy="302" r="18" fill="url(#knob)" stroke="#B9C1C9" stroke-width="1.5"/>
  <rect x="376.5" y="288" width="3" height="11" rx="1.5" fill="#7A848E"/>
</svg>
