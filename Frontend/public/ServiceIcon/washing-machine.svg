<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDE2E7"/>
      <stop offset="0.16" stop-color="#FFFFFF"/>
      <stop offset="0.78" stop-color="#F6F7F9"/>
      <stop offset="1" stop-color="#CFD5DB"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F4F6"/>
      <stop offset="1" stop-color="#E2E6EA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3137"/>
      <stop offset="1" stop-color="#14181C"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="0.5" stop-color="#C5CCD3"/>
      <stop offset="1" stop-color="#E9ECEF"/>
    </linearGradient>
    <radialGradient id="drum" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#4A5662"/>
      <stop offset="1" stop-color="#1C232A"/>
    </radialGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5CCD3"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- feet -->
  <rect x="146" y="428" width="30" height="14" rx="4" fill="#8E979F"/>
  <rect x="336" y="428" width="30" height="14" rx="4" fill="#8E979F"/>

