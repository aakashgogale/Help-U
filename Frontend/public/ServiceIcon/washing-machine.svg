  <rect x="124" y="62" width="264" height="372" rx="28" fill="url(#body)" stroke="#D1D7DD" stroke-width="2"/>
  <path d="M146 150 L162 152 L162 410 Q146 404 146 392 Z" fill="#FFFFFF" opacity="0.65"/>

  <!-- control panel -->
