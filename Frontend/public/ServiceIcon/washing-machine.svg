  <rect x="144" y="84" width="66" height="30" rx="7" fill="#FFFFFF" stroke="#D1D7DD" stroke-width="1.5"/>
  <rect x="150" y="97" width="54" height="4" rx="2" fill="#D1D7DD"/>
  <circle cx="246" cy="99" r="17" fill="url(#knob)" stroke="#B9C1C9" stroke-width="1.5"/>
