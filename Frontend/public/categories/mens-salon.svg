<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="skinM" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE2CC"/>
      <stop offset="100%" stop-color="#F0C099"/>
    </radialGradient>
    <linearGradient id="robeM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F7F9"/>
      <stop offset="100%" stop-color="#D7DBE1"/>
    </linearGradient>
  </defs>
  <!-- robe -->
  <path d="M16 112 C 22 86 42 76 60 76 C 78 76 98 86 104 112 Z" fill="url(#robeM)" stroke="#C7CDD4" stroke-width="1.2"/>
  <!-- V-neck -->
  <path d="M50 76 L 60 92 L 70 76 Z" fill="#E8EDF2"/>
  <!-- neck -->
  <rect x="52" y="68" width="16" height="12" rx="4" fill="url(#skinM)"/>
  <!-- head -->
  <ellipse cx="60" cy="48" rx="22" ry="24" fill="url(#skinM)" stroke="#E5B998" stroke-width="1"/>
  <!-- hair -->
  <path d="M40 36 Q50 20 60 20 Q70 20 80 36 Q82 42 80 46 Q70 36 60 36 Q50 36 40 46 Q38 42 40 36 Z" fill="#3A2A20"/>
