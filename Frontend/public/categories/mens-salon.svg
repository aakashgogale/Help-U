  <path d="M40 46 Q60 42 80 46 Q82 60 60 66 Q38 60 40 46 Z" fill="#BCE3B4" stroke="#8EC88A" stroke-width="1"/>
  <!-- eyes (closed) -->
  <path d="M46 52 Q51 55 56 52" fill="none" stroke="#2E2A26" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M64 52 Q69 55 74 52" fill="none" stroke="#2E2A26" stroke-width="1.6" stroke-linecap="round"/>
  <!-- beard -->
  <path d="M44 60 Q46 76 60 80 Q74 76 76 60 Q66 68 60 68 Q54 68 44 60 Z" fill="#5A3B2B"/>
  <!-- mustache -->
  <path d="M50 62 Q55 60 60 62 Q65 60 70 62 Q65 65 60 64 Q55 65 50 62 Z" fill="#4A2E20"/>
</svg>
