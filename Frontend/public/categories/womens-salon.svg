<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="skinW" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE2CC"/>
      <stop offset="100%" stop-color="#F4C9A8"/>
    </radialGradient>
    <linearGradient id="towelW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>
    <linearGradient id="robeW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F7F9"/>
      <stop offset="100%" stop-color="#D7DBE1"/>
    </linearGradient>
  </defs>
  <!-- robe/shoulders -->
  <path d="M18 112 C 22 86 42 76 60 76 C 78 76 98 86 102 112 Z" fill="url(#robeW)" stroke="#C7CDD4" stroke-width="1.2"/>
  <!-- neck -->
  <rect x="52" y="68" width="16" height="14" rx="4" fill="url(#skinW)"/>
  <!-- head -->
  <ellipse cx="60" cy="52" rx="22" ry="24" fill="url(#skinW)" stroke="#E5B998" stroke-width="1"/>
  <!-- face mask (green) -->
  <path d="M40 50 Q60 44 80 50 Q82 66 60 72 Q38 66 40 50 Z" fill="#BCE3B4" stroke="#8EC88A" stroke-width="1"/>
  <!-- eyes (cucumber-style ovals) -->
  <ellipse cx="51" cy="55" rx="4.5" ry="3" fill="#5FA058"/>
  <ellipse cx="69" cy="55" rx="4.5" ry="3" fill="#5FA058"/>
  <ellipse cx="51" cy="55" rx="2" ry="1.3" fill="#F0F7EC"/>
  <ellipse cx="69" cy="55" rx="2" ry="1.3" fill="#F0F7EC"/>
  <!-- lips -->
  <path d="M54 65 Q60 69 66 65 Q60 63 54 65 Z" fill="#E89494"/>
  <!-- head towel -->
  <path d="M30 36 C 30 20 50 10 60 10 C 70 10 90 20 90 36 L 90 42 C 90 42 76 32 60 32 C 44 32 30 42 30 42 Z" fill="url(#towelW)" stroke="#C7CDD4" stroke-width="1.2"/>
  <path d="M30 36 C 50 22 70 22 90 36" fill="none" stroke="#C7CDD4" stroke-width="0.8" opacity="0.7"/>
  <!-- towel knot -->
  <ellipse cx="60" cy="20" rx="10" ry="6" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1"/>
</svg>
