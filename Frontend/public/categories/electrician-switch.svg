<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Switchboard shadow -->
    <radialGradient id="swShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2024" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#1E2024" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1E2024" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy White modular switch plate -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Switch button rocker -->
    <linearGradient id="rockerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Red screwdriver handle -->
    <linearGradient id="drvHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5A"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Metal shaft -->
    <linearGradient id="metalShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Ambient shadow -->
  <ellipse cx="80" cy="132" rx="48" ry="7" fill="url(#swShadow)"/>

  <!-- Wall Switchboard Plate (Modular) -->
  <rect x="28" y="44" width="86" height="76" rx="8" fill="url(#plateGrad)" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Inner bevel border -->
  <rect x="34" y="50" width="74" height="64" rx="4" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- 3-Pin Power Socket (Left) -->
  <circle cx="56" cy="74" r="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="0.8"/>
  <!-- Earth pin -->
  <circle cx="56" cy="67" r="3" fill="#334155"/>
  <!-- Live and Neutral pins -->
  <circle cx="50" cy="78" r="2.2" fill="#334155"/>
  <circle cx="62" cy="78" r="2.2" fill="#334155"/>

  <!-- Rocker Switch (Right) -->
  <rect x="80" y="62" width="18" height="32" rx="3" fill="url(#rockerGrad)" stroke="#94A3B8" stroke-width="0.8"/>
  <line x1="80" y1="78" x2="98" y2="78" stroke="#94A3B8" stroke-width="1"/>
  <!-- Little neon indicator dot -->
  <circle cx="89" cy="69" r="1.5" fill="#EF4444"/>

  <!-- Screwdriver (Standing/slanted on right side) -->
  <g transform="rotate(-15 120 70)">
    <!-- Steel Shaft -->
    <rect x="117" y="24" width="4" height="52" rx="1" fill="url(#metalShaft)"/>
    <path d="M 116 24 L 119 18 L 122 24 Z" fill="#64748B"/>
    <!-- Red Handle -->
    <path d="M 114 74 C 114 72 124 72 124 74 L 126 112 C 126 118 112 118 112 112 Z" fill="url(#drvHandle)"/>
    <!-- Handle flutes -->
    <rect x="115" y="80" width="2" height="24" rx="1" fill="#7F1D1D"/>
    <rect x="118.5" y="80" width="2" height="24" rx="1" fill="#FEF2F2" opacity="0.6"/>
  </g>
</svg>
