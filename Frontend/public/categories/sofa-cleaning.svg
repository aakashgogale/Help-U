<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Floor shadow -->
    <radialGradient id="sofaShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2024" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#1E2024" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1E2024" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm beige fabric sofa gradient -->
    <linearGradient id="sofaFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="35%" stop-color="#EADDCB"/>
      <stop offset="75%" stop-color="#D9C7B0"/>
      <stop offset="100%" stop-color="#BC9E82"/>
    </linearGradient>

    <!-- Armrest gradient -->
    <linearGradient id="armFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="40%" stop-color="#E2D2BE"/>
      <stop offset="100%" stop-color="#C2A88E"/>
    </linearGradient>

    <!-- Yellow throw cushion gradient -->
    <linearGradient id="yellowCushion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Wood feet gradient -->
    <linearGradient id="woodFoot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Ambient shadow -->
  <ellipse cx="80" cy="136" rx="46" ry="7" fill="url(#sofaShadow)"/>

  <!-- Wooden angled legs -->
  <polygon points="46,126 40,136 44,136 49,126" fill="url(#woodFoot)"/>
  <polygon points="114,126 120,136 116,136 111,126" fill="url(#woodFoot)"/>

  <!-- Backrest -->
  <rect x="42" y="48" width="76" height="58" rx="14" fill="url(#sofaFabric)" stroke="#C7B299" stroke-width="0.8"/>
  <line x1="80" y1="52" x2="80" y2="92" stroke="#B89F82" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- Seat Base Cushion -->
  <rect x="40" y="86" width="80" height="26" rx="8" fill="url(#sofaFabric)" stroke="#C7B299" stroke-width="0.8"/>
  <rect x="38" y="106" width="84" height="20" rx="6" fill="#C2A88E"/>

  <!-- Yellow Accent Pillow (tucked on left side) -->
  <g transform="rotate(12 66 84)">
    <rect x="54" y="68" width="22" height="24" rx="5" fill="url(#yellowCushion)" stroke="#A16207" stroke-width="0.7"/>
    <!-- Pillow highlight seam -->
    <line x1="58" y1="72" x2="72" y2="86" stroke="#FEF08A" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Left Armrest (plush rounded) -->
  <rect x="32" y="70" width="18" height="48" rx="9" fill="url(#armFabric)" stroke="#B89F82" stroke-width="0.8"/>
  <!-- Right Armrest (plush rounded) -->
  <rect x="110" y="70" width="18" height="48" rx="9" fill="url(#armFabric)" stroke="#B89F82" stroke-width="0.8"/>
</svg>
