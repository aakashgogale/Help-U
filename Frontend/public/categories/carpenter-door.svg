<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Door shadow -->
    <radialGradient id="doorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2024" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#1E2024" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1E2024" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm wood door finish -->
    <linearGradient id="doorWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="30%" stop-color="#A16207"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Inner panels -->
    <linearGradient id="innerPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <!-- Cordless drill yellow body -->
    <linearGradient id="drillYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="45%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Drill chuck & battery dark grey -->
    <linearGradient id="drillBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Ambient shadow -->
  <ellipse cx="78" cy="138" rx="48" ry="7" fill="url(#doorShadow)"/>

  <!-- Wooden Door (Panels) -->
  <rect x="36" y="28" width="56" height="106" rx="4" fill="url(#doorWood)" stroke="#5A2E0E" stroke-width="1"/>
  <!-- Top Panel -->
  <rect x="42" y="34" width="44" height="26" rx="2" fill="url(#innerPanel)" stroke="#5A2E0E" stroke-width="0.8"/>
  <!-- Middle Panel -->
  <rect x="42" y="66" width="44" height="28" rx="2" fill="url(#innerPanel)" stroke="#5A2E0E" stroke-width="0.8"/>
  <!-- Bottom Panel -->
  <rect x="42" y="100" width="44" height="28" rx="2" fill="url(#innerPanel)" stroke="#5A2E0E" stroke-width="0.8"/>
  <!-- Door Knob / Handle -->
  <circle cx="86" cy="80" r="3" fill="#FBBF24"/>
  <circle cx="86" cy="80" r="1.5" fill="#D97706"/>

  <!-- Yellow & Black Cordless Power Drill (in foreground on right side) -->
  <!-- Drill Bit pointing left towards the door -->
  <line x1="86" y1="88" x2="98" y2="88" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chuck -->
  <rect x="98" y="84" width="7" height="8" rx="1.5" fill="url(#drillBlack)"/>

  <!-- Drill Motor Housing (Yellow) -->
  <rect x="105" y="80" width="22" height="16" rx="4" fill="url(#drillYellow)" stroke="#A16207" stroke-width="0.8"/>
  <rect x="110" y="83" width="10" height="3" rx="1" fill="#111827"/>

  <!-- Pistol Grip Handle (slanted down) -->
  <path d="M 112 96 L 118 122 C 118 124 125 124 125 122 L 123 96 Z" fill="url(#drillYellow)"/>
  <rect x="111" y="99" width="3" height="6" rx="1" fill="#DC2626"/> <!-- Trigger -->
  <!-- Rubber overmold on handle -->
  <path d="M 119 100 L 122 120" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Battery Pack at Base -->
  <rect x="112" y="122" width="18" height="10" rx="3" fill="url(#drillBlack)"/>
  <rect x="114" y="123" width="14" height="2" rx="1" fill="#EF4444"/>
</svg>
