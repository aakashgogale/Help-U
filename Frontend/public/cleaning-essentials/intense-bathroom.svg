<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ibWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#E3D9C7"/>
    </linearGradient>
    <linearGradient id="ibFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4CBB9"/>
      <stop offset="100%" stop-color="#A99F8A"/>
    </linearGradient>
    <linearGradient id="ibToilet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8EA"/>
    </linearGradient>
    <radialGradient id="ibSkin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F3D4B4"/>
      <stop offset="100%" stop-color="#C99670"/>
    </radialGradient>
    <linearGradient id="ibTool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3F"/>
      <stop offset="100%" stop-color="#17171A"/>
    </linearGradient>
  </defs>
  <!-- wall + floor -->
  <rect width="220" height="150" fill="url(#ibWall)"/>
  <rect y="150" width="220" height="70" fill="url(#ibFloor)"/>
  <!-- tile grout lines -->
  <line x1="0" y1="55" x2="220" y2="55" stroke="#D1C7B2" stroke-width="0.8"/>
  <line x1="0" y1="110" x2="220" y2="110" stroke="#D1C7B2" stroke-width="0.8"/>
  <line x1="55" y1="0" x2="55" y2="150" stroke="#D1C7B2" stroke-width="0.8"/>
  <line x1="110" y1="0" x2="110" y2="150" stroke="#D1C7B2" stroke-width="0.8"/>
  <line x1="165" y1="0" x2="165" y2="150" stroke="#D1C7B2" stroke-width="0.8"/>
  <!-- hand shower (left wall) -->
  <circle cx="20" cy="90" r="4" fill="#9A9087"/>
  <path d="M20 94 Q 18 110 16 150" stroke="#555" stroke-width="2.5" fill="none"/>
  <!-- toilet paper (right wall) -->
  <rect x="195" y="80" width="15" height="18" rx="2" fill="#DAD0BC"/>
  <circle cx="202.5" cy="89" r="4.5" fill="#FFFFFF"/>
  <!-- toilet bowl (centerpiece) -->
  <!-- tank -->
  <path d="M95 55 L 150 55 Q 155 55 155 60 L 155 85 Q 155 90 150 90 L 95 90 Q 90 90 90 85 L 90 60 Q 90 55 95 55 Z" fill="url(#ibToilet)" stroke="#C9C0B0" stroke-width="1"/>
  <!-- flush button -->
  <rect x="118" y="68" width="8" height="12" rx="2" fill="#C9C0B0"/>
  <!-- seat/lid -->
  <ellipse cx="122" cy="110" rx="48" ry="12" fill="url(#ibToilet)" stroke="#C9C0B0" stroke-width="1"/>
  <ellipse cx="122" cy="115" rx="42" ry="10" fill="#DADADC"/>
  <ellipse cx="122" cy="113" rx="40" ry="8" fill="#2A2A2E" opacity="0.08"/>
  <!-- bowl body -->
  <path d="M80 115 Q 85 165 122 170 Q 160 165 165 115 Z" fill="url(#ibToilet)" stroke="#C9C0B0" stroke-width="1"/>
  <!-- shadow under bowl -->
  <ellipse cx="122" cy="178" rx="48" ry="4" fill="#000" opacity="0.15"/>

  <!-- cleaning tool (electric scrubber at base) -->
  <!-- scrubber head -->
  <ellipse cx="122" cy="185" rx="18" ry="6" fill="url(#ibTool)"/>
  <circle cx="122" cy="183" r="12" fill="#1A1A1C" stroke="#000" stroke-width="0.6"/>
  <circle cx="122" cy="183" r="8" fill="#4A4A4F"/>
  <path d="M114 183 L 130 183 M 122 175 L 122 191 M 116 177 L 128 189 M 128 177 L 116 189" stroke="#2A2A2E" stroke-width="1" opacity="0.7"/>
  <!-- shaft going up to hand -->
  <rect x="135" y="130" width="5" height="55" rx="2" fill="url(#ibTool)" transform="rotate(18 137 157)"/>
  <!-- hand (coming from right side) -->
  <path d="M150 115 Q 170 108 185 118 Q 190 128 182 138 Q 170 142 155 135 Q 148 128 150 115 Z" fill="url(#ibSkin)"/>
  <!-- cuff -->
  <rect x="178" y="108" width="22" height="12" rx="3" fill="#2A2A2E"/>
  <!-- small water drops -->
  <circle cx="100" cy="145" r="1.5" fill="#8DD2E8" opacity="0.8"/>
  <circle cx="145" cy="150" r="1.3" fill="#8DD2E8" opacity="0.8"/>
  <circle cx="90" cy="160" r="1.2" fill="#8DD2E8" opacity="0.7"/>
</svg>
