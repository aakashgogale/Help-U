<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bcTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EFE9"/>
      <stop offset="100%" stop-color="#DDD6CC"/>
    </linearGradient>
    <linearGradient id="bcFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7CFC2"/>
      <stop offset="100%" stop-color="#A89C87"/>
    </linearGradient>
    <radialGradient id="bcSkin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F3D4B4"/>
      <stop offset="100%" stop-color="#C99670"/>
    </radialGradient>
    <linearGradient id="bcUniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1F23"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
  </defs>
  <!-- tiled wall -->
  <rect width="200" height="130" fill="url(#bcTile)"/>
  <line x1="0" y1="40" x2="200" y2="40" stroke="#C9C0B0" stroke-width="0.8"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="#C9C0B0" stroke-width="0.8"/>
  <line x1="40" y1="0" x2="40" y2="130" stroke="#C9C0B0" stroke-width="0.8"/>
  <line x1="80" y1="0" x2="80" y2="130" stroke="#C9C0B0" stroke-width="0.8"/>
  <line x1="120" y1="0" x2="120" y2="130" stroke="#C9C0B0" stroke-width="0.8"/>
  <line x1="160" y1="0" x2="160" y2="130" stroke="#C9C0B0" stroke-width="0.8"/>
  <!-- floor -->
  <rect y="130" width="200" height="70" fill="url(#bcFloor)"/>
  <!-- toilet (left) -->
  <ellipse cx="55" cy="140" rx="25" ry="10" fill="#F8F8F8" stroke="#B8AE9A" stroke-width="1"/>
  <rect x="38" y="100" width="34" height="42" rx="4" fill="#F0F0F0" stroke="#B8AE9A"/>
  <rect x="42" y="90" width="26" height="14" rx="3" fill="#D9D9D9"/>
  <!-- worker crouched (right side of toilet) -->
  <!-- pants -->
  <path d="M80 185 Q 100 155 130 155 Q 155 160 170 185 L 170 200 L 80 200 Z" fill="url(#bcUniform)"/>
  <!-- shirt / torso -->
  <path d="M105 145 Q 125 125 150 130 Q 165 150 160 165 L 110 170 Z" fill="url(#bcUniform)"/>
  <!-- head -->
  <ellipse cx="140" cy="105" rx="18" ry="20" fill="url(#bcSkin)"/>
  <!-- cap -->
  <path d="M122 95 Q 140 78 158 95 L 158 105 L 122 105 Z" fill="url(#bcUniform)"/>
  <rect x="124" y="105" width="32" height="3" fill="#0A0A0C"/>
  <!-- mask -->
  <path d="M127 108 Q 140 112 153 108 L 155 117 Q 140 122 125 117 Z" fill="#8DD2E8" stroke="#5CA6BE" stroke-width="0.6"/>
  <!-- arm holding sprayer -->
  <path d="M150 155 Q 165 145 170 130" stroke="url(#bcUniform)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- spray bottle -->
  <rect x="162" y="115" width="18" height="22" rx="3" fill="#2E8B5A"/>
  <rect x="165" y="108" width="12" height="10" rx="2" fill="#1A5E3B"/>
  <path d="M174 108 L 180 102 L 184 105 L 178 112 Z" fill="#1A5E3B"/>
  <!-- gloves -->
  <circle cx="112" cy="168" r="7" fill="#88E0C7"/>
  <!-- water drops on toilet area -->
  <circle cx="60" cy="88" r="2" fill="#8DD2E8" opacity="0.9"/>
  <circle cx="72" cy="94" r="1.5" fill="#8DD2E8" opacity="0.9"/>
  <circle cx="48" cy="94" r="1.5" fill="#8DD2E8" opacity="0.9"/>
  <!-- subtle sparkle on floor -->
  <path d="M30 170 L32 174 L36 176 L32 178 L30 182 L28 178 L24 176 L28 174 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M100 175 L101.5 178 L104 179.5 L101.5 181 L100 184 L98.5 181 L96 179.5 L98.5 178 Z" fill="#FFFFFF" opacity="0.7"/>
</svg>
